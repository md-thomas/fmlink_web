[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fmlink_web"
version = "0.1.0"
description = "Web interface for an FMlink station (FastAPI backend + Svelte frontend)"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = ["fastapi", "uvicorn[standard]>=0.54", "numpy"]

[project.optional-dependencies]
test = ["httpx"]

[project.scripts]
fmlink-web = "fmlink_web.main:main"

[tool.setuptools]
packages = ["fmlink_web"]

[tool.setuptools.package-data]
fmlink_web = ["static/*"]
