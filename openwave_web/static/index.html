<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenWave station</title>
<style>
  :root { color-scheme: light dark; --muted: #888; --ok: #2a7; --bad: #c33; }
  body { font: 15px/1.4 system-ui, sans-serif; margin: 0 auto; max-width: 900px; padding: 12px 16px; }
  header { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: baseline; }
  h1 { font-size: 1.2rem; margin: 0; }
  .muted { color: var(--muted); font-size: 0.9em; }
  #chat { border: 1px solid #8884; border-radius: 6px; height: 50vh; overflow-y: auto; padding: 8px; margin: 10px 0; }
  .msg { margin: 4px 0; } .me { text-align: right; } .status { font-size: 0.8em; color: var(--muted); }
  form { display: flex; gap: 8px; } input { flex: 1; padding: 8px; font-size: 1rem; }
  button { padding: 8px 14px; font-size: 1rem; }
  pre { max-height: 25vh; overflow-y: auto; font-size: 0.8em; background: #8881; padding: 6px; }
  .tx { color: var(--bad); font-weight: bold; }
</style>
</head>
<body>
<header>
  <h1 id="title">OpenWave station</h1>
  <span id="link" class="muted">connecting...</span>
  <span id="level" class="muted"></span>
  <span id="tx" class="tx"></span>
</header>
<p class="muted">Placeholder page - the full interface (Svelte) comes next. Type a message, or a /command (e.g. /ping).</p>
<div id="chat"></div>
<form id="send"><input id="text" autocomplete="off" placeholder="message or /command"><button>Send</button></form>
<h3>Last bursts</h3><pre id="bursts"></pre>
<h3>Log</h3><pre id="log"></pre>
<script>
const $ = id => document.getElementById(id);
const sent = {};   // message id -> status element
function line(text, cls) {
  const d = document.createElement('div'); d.className = 'msg ' + (cls || ''); d.textContent = text;
  $('chat').appendChild(d); $('chat').scrollTop = 1e9; return d;
}
function showLink(l) {
  if (!l) return;
  $('title').textContent = `${l.station_id} → ${l.dst_id}`;
  $('link').textContent = `mode ${l.mode_id} (${l.modulation} ${l.symbol_rate} sym/s, ${l.fec_preset})` +
    `${l.batch_active ? ', batching' : ''}${l.connected ? '' : ', NOT connected'}`;
}
function handle(e) {
  switch (e.type) {
    case 'snapshot': showLink(e.link); e.messages.forEach(handle); e.bursts.slice(-10).forEach(handle);
                     e.logs.slice(-50).forEach(handle); break;
    case 'link': showLink(e); break;
    case 'message_tx': { const d = line(`${e.text}`, 'me');
      const s = document.createElement('div'); s.className = 'status';
      s.textContent = `sending, ${e.segments} segment(s)`; d.appendChild(s); sent[e.id] = s; break; }
    case 'delivery': { const s = sent[e.id]; if (!s) break;
      s.textContent = e.failed ? 'NOT delivered' : e.done ? (e.acked === null ? 'sent (no ACK requested)' : 'delivered ✓')
                    : `${e.acked}/${e.total} segments acknowledged`; break; }
    case 'message_rx': line(`${e.src}: ${e.text}`); break;
    case 'burst_rx': $('bursts').textContent = (`${new Date(e.time * 1000).toLocaleTimeString()} ${e.status} ` +
      `${e.modulation} ${e.symbol_rate} SNR ${e.snr_db === null ? '-' : e.snr_db.toFixed(1)} dB ` +
      `sync ${e.quality === null ? '-' : e.quality.toFixed(2)}\n` + $('bursts').textContent).slice(0, 4000); break;
    case 'level': $('level').textContent = `rx ${e.rms_dbfs} dBFS`; break;
    case 'tx': $('tx').textContent = e.state === 'keyed' ? 'TX' : ''; break;
    case 'log': $('log').textContent = (e.text + '\n' + $('log').textContent).slice(0, 20000); break;
  }
}
function connect() {
  const ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/api/events`);
  ws.onmessage = m => handle(JSON.parse(m.data));
  ws.onclose = () => { $('link').textContent = 'disconnected - retrying...'; setTimeout(connect, 2000); };
  ws.onopen = () => { $('chat').innerHTML = ''; $('log').textContent = ''; $('bursts').textContent = ''; };
}
$('send').onsubmit = async ev => {
  ev.preventDefault(); const text = $('text').value.trim(); if (!text) return;
  const command = text.startsWith('/');
  const r = await fetch(command ? '/api/command' : '/api/send', {method: 'POST',
    headers: {'Content-Type': 'application/json'}, body: JSON.stringify(command ? {line: text} : {text})});
  if (!r.ok) line('error: ' + (await r.json()).detail, 'status'); else $('text').value = '';
};
connect();
</script>
</body>
</html>
